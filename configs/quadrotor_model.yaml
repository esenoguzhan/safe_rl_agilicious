# quadrotor_model.yaml — parameters for standalone quadrotor model (Flightmare-compatible)
# Used by scripts/quadrotor_model.py. Compatible with CBF/safety filter (e.g. ACADIS).

quadrotor_model:
  # Inertial
  mass: 0.774
  arm_l: 0.125
  # Inertia: J = (mass/12)*arm_l^2 * diag(J_xx, J_yy, J_zz). Flightmare uses (4.5, 4.5, 7).
  inertia_scale: [4.5, 4.5, 7.0]

  # Motors (same as flightlib quadrotor_dynamics)
  motor_omega_min: 150.0
  motor_omega_max: 2800.0
  motor_tau: 0.033   # First-order time constant (s): u_actual_dot = (u_cmd - u_actual)/motor_tau
  thrust_map: [1.562522e-6, 0.0, 0.0]   # T = a*omega^2 + b*omega + c per motor
  kappa: 0.022

  # Motor lag in step(): if true, step() applies first-order lag to commanded thrust before dynamics.
  # dynamics_derivative(x, u) always uses u as applied thrust (no lag) for CBF/Lie derivatives.
  use_motor_lag: true

  # Body rate limits [rad/s] (x, y, z)
  omega_max: [10.0, 10.0, 4.0]

  # World
  gravity: -9.81
