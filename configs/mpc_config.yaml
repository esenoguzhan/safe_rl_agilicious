# MPC (Model Predictive Control) config for quadrotor goal tracking.
# Used by scripts/mpc_controller.py and scripts/eval_mpc.py.
# Comparable with RL+CBF evaluation (scripts/eval_cbf.py).

mpc:
  # Prediction horizon
  N: 50                            # number of shooting intervals
  dt: 0.02                         # discretization step (match sim_dt)

  # Cost weights — diagonal entries of Q (state) and R (control) matrices.
  # State reference: p=goal, q=[1,0,0,0], v=0, omega=0.
  Q_pos: [8.0, 8.0, 15.0]      # position tracking [x, y, z]
  Q_vel: [1.0, 1.0, 1.0]          # velocity regulation
  Q_omega: [1.0, 1.0, 1.0]        # angular rate regulation
  Q_quat: [5.0, 1.0, 1.0, 1.0]    # quaternion error (w, x, y, z)
  R: [0.01, 0.01, 0.01, 0.01]     # control effort (per-motor thrust)

  # Terminal cost multiplier: Q_terminal = terminal_weight * Q
  terminal_weight: 10.0

  # State box on z only (indices 0,1 are ignored; use scripts/mpc_barrier_bounds + cbf r_uav for eval scripts).
  pos_min: [-40.0, -40.0, 1.0]
  pos_max: [40.0, 40.0, 8.0]

  # Slack (soft constraints): relaxes position constraints when infeasible.
  # Matches CBF slack formulation for fair comparison.
  # Penalty per stage: K_lin * sum(slack) + K_quad * sum(slack^2)
  # NOTE: MPC has N=50 stages so use moderate values to avoid ill-conditioning.
  use_slack: true
  K_lin: 1.0e6
  K_quad: 1.0e4

  # Solver settings (acados)
  max_iter: 100                  # SQP iterations per solve (RTI: 1, full SQP: up to max_iter)
  qp_solver: PARTIAL_CONDENSING_HPIPM
  nlp_solver: SQP                 # SQP (full) for robustness; SQP_RTI for speed
  integrator: ERK                 # ERK (explicit RK) or IRK (implicit RK)
  integrator_steps: 4             # number of integrator sub-steps per interval

  # Reference (default; can be overridden via --goal CLI)
  goal_position: [0.0, 0.0, 5.0]

  # Quadrotor model config path (null = default configs/quadrotor_model.yaml)
  quadrotor_model_path: null
