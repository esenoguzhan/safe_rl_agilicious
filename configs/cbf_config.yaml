# CBF filter config (position barriers only).
# Implements Cheng et al. "End-to-End Safe RL through Barrier Functions" (AAAI 2019).
#
# Continuous-time CBF (default, recommended):
#   L_f h + L_g h * u >= -alpha * h
#   The continuous formulation has ~50x more control authority than the discrete
#   one-step-ahead formulation (L_g_h ~ 0.665/motor vs 0.013/motor) because the
#   Lie derivatives are not scaled by dt or dt^2.
#
# Discrete CBF (paper Eq 8/14):
#   h(s_{t+1}) >= (1-eta)*h(s_t) - epsilon
#   NOTE: With dt=0.02, the per-step control authority is very small. The QP is
#   infeasible at most steps, requiring slack. Use continuous-time CBF instead.

cbf:
  # Use discrete CBF (paper Eq 8): h_{t+1} >= (1-eta)*h_t.
  # If false, use continuous-time: L_f h + L_g h * u >= -alpha * h.
  discrete_cbf: false

  # Continuous-time CBF decay rate.
  # dh/dt >= -alpha*h allows exponential decrease; the CBF intervenes when the
  # RL action would cause a faster decrease. Larger alpha = more permissive.
  alpha: 0.7

  # Discrete CBF parameters (only used when discrete_cbf: true).
  eta: 0.01
  dt: 0.02
  discrete_cbf_use_model_step: true
  integrate: "rk4"

  # UAV radius / safety margin (paper Sec 3.1).
  r_uav: 0.0

  # Position barriers: velocity-aware h(p,v) = n'p + q + kv*(n'v). Safe iff h >= 0.
  # kv > 0: as approach speed (n'v < 0) increases, h decreases -> earlier intervention.
  position_barriers:
    - name: ground
      n: [0.0, 0.0, 1.0]
      q: 1.0
      kv: 0.5
    - name: ceiling
      n: [0.0, 0.0, -1.0]
      q: 8.0
      kv: 0.5
    - name: x_min
      n: [1.0, 0.0, 0.0]
      q: 8.0
      kv: 0.5
    - name: x_max
      n: [-1.0, 0.0, 0.0]
      q: 8.0
      kv: 0.5
    - name: y_min
      n: [0.0, 1.0, 0.0]
      q: 8.0
      kv: 0.5
    - name: y_max
      n: [0.0, -1.0, 0.0]
      q: 8.0
      kv: 0.5

  # QP solver: "osqp", "scipy", or "acados" (HPIPM, same backend as MPC).
  # Both osqp and acados produce identical results; acados matches MPC solver.
  solver: acados
  max_iter: 100

  # Slack variable: relaxes CBF constraint when infeasible due to actuator limits.
  # Penalty: K_lin * sum(eps) + K_quad * sum(eps^2)  (matches MPC slack formulation)
  use_slack: true
  K_lin: 1000.0
  K_quad: 100.0

  # Quadrotor model config.
  quadrotor_model_path: null
